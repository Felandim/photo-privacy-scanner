<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Privacy Scanner</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;background:#0b1014;color:#ecf5f8}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:32px 18px 60px}h1{font-size:clamp(2.2rem,7vw,4.5rem);line-height:1;margin:.15em 0}p{color:#9caeb8;line-height:1.5}.card{background:#111a20;border:1px solid #24343d;border-radius:18px;padding:20px;margin-top:18px}.upload{display:block;border:1px dashed #527080;border-radius:14px;padding:18px}.preview{max-width:100%;max-height:520px;border-radius:14px;margin-top:16px}button{background:#d9f66f;color:#111;border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer;margin-top:14px}button.secondary{background:#24343d;color:#ecf5f8;margin-left:8px}button:disabled{opacity:.45;cursor:not-allowed}.score{font-size:3.4rem;font-weight:900}.risk{display:flex;justify-content:space-between;gap:18px;border-top:1px solid #24343d;padding:12px 0}.tag{font-size:.78rem;border:1px solid #3f5966;border-radius:999px;padding:4px 8px}.muted{font-size:.85rem;color:#7f939d}pre{white-space:pre-wrap;max-height:220px;overflow:auto;color:#b7c5cb;background:#0a0f12;padding:12px;border-radius:10px}
  </style>
</head>
<body><main>
  <div class="muted">LOCAL PRIVACY CHECK</div><h1>Photo Privacy Scanner</h1>
  <p>Analisa uma foto antes da publicação procurando localização EXIF, texto sensível e, quando o navegador suporta, rostos. O arquivo não é enviado ao seu servidor.</p>
  <section class="card">
    <label class="upload">Escolha uma foto<br><input id="file" type="file" accept="image/*"></label>
    <img id="preview" class="preview" alt="Prévia da foto">
    <br><button id="scan" disabled>Escanear foto</button><button id="strip" class="secondary" disabled>Baixar sem metadados</button>
    <div id="progress" class="muted"></div>
    <div id="stripStatus" class="muted"></div>
  </section>
  <section class="card"><span class="muted">RISCO ESTIMADO</span><div id="score" class="score">—</div><div id="risks"></div></section>
  <section class="card"><strong>Texto reconhecido</strong><pre id="ocr">—</pre></section>
</main>
<script type="module">
import * as exifr from 'https://cdn.jsdelivr.net/npm/exifr@7.1.3/+esm';
import { createWorker } from 'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/+esm';
const fileEl=document.querySelector('#file'),preview=document.querySelector('#preview'),scan=document.querySelector('#scan'),strip=document.querySelector('#strip'),scoreEl=document.querySelector('#score'),risksEl=document.querySelector('#risks'),ocrEl=document.querySelector('#ocr'),progress=document.querySelector('#progress'),stripStatus=document.querySelector('#stripStatus');let file,previewUrl;
fileEl.onchange=()=>{file=fileEl.files?.[0];if(previewUrl)URL.revokeObjectURL(previewUrl);if(!file)return;previewUrl=URL.createObjectURL(file);preview.src=previewUrl;preview.onload=()=>{scan.disabled=false;strip.disabled=false};scoreEl.textContent='—';risksEl.innerHTML='';ocrEl.textContent='—';stripStatus.textContent=''};
function addRisk(list,label,weight,detail){list.push({label,weight,detail})}
function canvasBlob(canvas,type){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Falha ao reencodar a imagem.')),type,type==='image/jpeg'?0.95:undefined))}
strip.onclick=async()=>{if(!file||!preview.naturalWidth)return;strip.disabled=true;stripStatus.textContent='Removendo metadados localmente…';try{
  const canvas=document.createElement('canvas');canvas.width=preview.naturalWidth;canvas.height=preview.naturalHeight;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas não suportado neste navegador.');ctx.drawImage(preview,0,0,canvas.width,canvas.height);
  const outputType=file.type==='image/jpeg'?'image/jpeg':'image/png';const cleanBlob=await canvasBlob(canvas,outputType);const gps=await exifr.gps(cleanBlob).catch(()=>null);if(gps?.latitude!=null||gps?.longitude!=null)throw new Error('A verificação encontrou GPS na cópia gerada.');
  const ext=outputType==='image/jpeg'?'jpg':'png';const base=(file.name||'foto').replace(/\.[^.]+$/,'');const href=URL.createObjectURL(cleanBlob);const a=document.createElement('a');a.href=href;a.download=`${base}-sem-metadados.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(href),1000);stripStatus.textContent='Cópia reencodada e verificada sem GPS/EXIF. Conteúdo visível (rostos, texto e placas) não é alterado.';
}catch(e){stripStatus.textContent=`Erro: ${e.message}`}finally{strip.disabled=false}};
scan.onclick=async()=>{if(!file)return;scan.disabled=true;const risks=[];try{
  progress.textContent='Lendo metadados…';try{const gps=await exifr.gps(file);if(gps?.latitude!=null&&gps?.longitude!=null)addRisk(risks,'Localização GPS',40,`${gps.latitude.toFixed(5)}, ${gps.longitude.toFixed(5)}`)}catch{}
  progress.textContent='Executando OCR…';const worker=await createWorker('eng');const result=await worker.recognize(file);await worker.terminate();const text=result.data.text||'';ocrEl.textContent=text.trim()||'Nenhum texto reconhecido.';
  const email=text.match(/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/g)||[];const phone=text.match(/(?:\+?\d[\d\s().-]{7,}\d)/g)||[];const url=text.match(/(?:https?:\/\/|www\.)\S+/gi)||[];if(email.length)addRisk(risks,'E-mail visível',25,`${email.length} ocorrência(s)`);if(phone.length)addRisk(risks,'Telefone/número',25,`${phone.length} ocorrência(s)`);if(url.length)addRisk(risks,'URL visível',10,`${url.length} ocorrência(s)`);
  if('FaceDetector' in window){progress.textContent='Procurando rostos…';try{const detector=new FaceDetector({fastMode:true,maxDetectedFaces:10});const faces=await detector.detect(preview);if(faces.length)addRisk(risks,'Rostos detectados',Math.min(30,faces.length*10),`${faces.length} rosto(s)`)}catch{}}
  const score=Math.min(100,risks.reduce((s,r)=>s+r.weight,0));scoreEl.textContent=`${score}/100`;risksEl.innerHTML=risks.length?risks.map(r=>`<div class="risk"><div><strong>${r.label}</strong><div class="muted">${r.detail}</div></div><span class="tag">+${r.weight}</span></div>`).join(''):'<p>Nenhum risco coberto pelo MVP foi detectado.</p>';progress.textContent='Análise concluída.';
}catch(e){progress.textContent=`Erro: ${e.message}`}finally{scan.disabled=false}};
</script></body></html>
